# 临时验证 workflow：用 push 触发做一次云端干跑（只扫描，不发送任何消息）。
# 目的：确认云端环境（隐身 Chromium 下载、字体、依赖、登录、会话扫描）是否正常。
# 验证完成后会连同 tools/dryrun.py 一起删除。
name: _temp_verify

on:
  push:
    branches: [main]

env:
  CLOAK_CHROMIUM_VERSION: 146.0.7680.177.5
  CLOAKBROWSER_AUTO_UPDATE: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  dryrun:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 安装 Chromium 系统依赖
      run: python -m playwright install-deps chromium

    - name: 下载隐身 Chromium
      run: |
        set -euo pipefail
        tag="chromium-v${CLOAK_CHROMIUM_VERSION}"
        url="https://github.com/CloakHQ/CloakBrowser/releases/download/${tag}/cloakbrowser-linux-x64.tar.gz"
        curl -fL --connect-timeout 15 --max-time 600 --retry 2 -o /tmp/cb.tar.gz "$url"
        mkdir -p /tmp/cb_extract "$HOME/cloakbrowser"
        tar -xzf /tmp/cb.tar.gz -C /tmp/cb_extract
        rm -f /tmp/cb.tar.gz
        chrome="$(find /tmp/cb_extract -maxdepth 6 -type f -name chrome -perm -u+x | head -n 1)"
        test -n "${chrome}" || { echo "发布包里没找到 chrome 二进制" >&2; exit 1; }
        cp -a "$(dirname "${chrome}")/." "$HOME/cloakbrowser/"
        chmod +x "$HOME/cloakbrowser/chrome"
        test -f "$HOME/cloakbrowser/icudtl.dat" || { echo "缺 icudtl.dat" >&2; exit 1; }
        "$HOME/cloakbrowser/chrome" --version
        echo "CLOAKBROWSER_BINARY_PATH=$HOME/cloakbrowser/chrome" >> "$GITHUB_ENV"

    - name: Export Github Environment Variables and Secrets to JSON
      env:
        VARS_JSON: ${{ toJson(vars) }}
        SECRETS_JSON: ${{ toJson(secrets) }}
      run: python utils/export_github_env.py

    - name: 干跑（只扫描，不发送）
      run: python tools/dryrun.py
